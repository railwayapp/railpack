name: Linting, Formatting, and Unit Tests

# Security: Actions are pinned to commit SHAs instead of tags/versions where possible.
# Tags are mutable and can be force-pushed, allowing attackers to replace trusted
# code with malicious code. SHAs are immutable and protect against supply chain attacks.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  schedule:
    # run every day to alert against changes in default mise versions which break snapshot tests
    - cron: "0 0 * * *"

env:
  MISE_ENV: ci

jobs:
  test:
    name: Check and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Go Checks
        run: mise run check

      - name: Test Unit
        run: mise run test

  test-windows:
    name: Check and Test (Windows)
    runs-on: windows-latest
    env:
      # mise tasks are bash scripts, but mise defaults to cmd on Windows
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: '"C:/Program Files/Git/bin/bash.exe" -c -o errexit'
      MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: '"C:/Program Files/Git/bin/bash.exe"'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Go Checks
        run: mise run check

      - name: Test Unit
        run: mise run test

      # CLI end-to-end checks from the integration suite that need no Docker. Windows
      # runners cannot run Linux containers, so image builds stay on the Linux jobs.
      - name: Test CLI schema and info
        shell: bash
        env:
          EXAMPLE_PROJECT_NAME: go-workspaces
        run: |
          mkdir -p tmp
          mise run test:integration:schema
          mise run test:integration:info
