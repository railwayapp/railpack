name: Linting, Formatting, and Unit Tests

# Action versions are managed and locked to immutable commit SHAs in actions.lock

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  schedule:
    # run every day to alert against changes in default mise versions which break snapshot tests
    - cron: "0 0 * * *"

env:
  MISE_ENV: ci

jobs:
  test:
    name: Check and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Go Checks
        run: mise run check

      - name: Test Unit
        run: mise run test
