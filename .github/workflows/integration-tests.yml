name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  schedule:
    # run every day to alert against breaking changes in mise backends
    # the backends used for various projects (in registry.toml) are compiled into the mise binary, but the code that runs
    # these backends, and the services they connect to are not. By running integration tests each day, we'll know if
    # something changes in the package ecosystem that breaks one of our build tests.
    - cron: "0 0 * * *"

env:
  MISE_ENV: ci

jobs:
  # generate a JSON array of all entries in examples/ to shard out example into a separate job that can be run in parallel
  find-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.find-examples.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find examples with test.json
        id: find-examples
        run: |
          examples=$(find examples -name "test.json" -exec dirname {} \; | xargs -n 1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  # integration tests plan, build, and run example projects. Running the example projects requires both the builder and runtime
  # images. If the mise version in version.txt is newer than origin/main, we build fresh images containing the pinned mise version.
  # The code below builds these required images, and pushes them to a production registry so they can be used properly in the
  # matrix jobs (which all run in an isolated runner, so they must reference a remote registry).
  # These images are *not* tagged with `latest` or other more generic tags used in the release workflow. Additionally,
  # since railpack uses a image tag from the mise version compiled into the binary, pushes to the registry should not cause
  # any production impacts.
  build-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      # duplicated on the release.yml job, keep these in sync
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # we need the full history to compare the mise version against origin/main
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: ${{ env.DOCKER_VERSION }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.PRODUCTION_CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # since railpack binary is pinned to a specific image version, we only want to build and push the images if the mise version
      # in version.txt is newer than what is on origin/main. We intentionally only trigger on upgrades to avoid mutating images
      # that may already be referenced by released railpack binaries or production usage.
      # Mise versions are updated frequently, which means we'll pick up any updates to the `FROM` images regularly, so we shouldn't need
      # to update these images outside of a mise version update.
      - name: Check for image input changes
        id: mise_version
        run: |
          if mise run mise-version-newer-than-main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Build Builder Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.mise_version.outputs.changed == 'true'
        with:
          context: images/debian/build
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.PRODUCTION_BUILDER_IMAGE_REF }}
          build-args: MISE_VERSION=${{ env.RAILPACK_MISE_VERSION }}
          push: true
          # instead of figuring out the right "what's changed" mechanism
          cache-from: type=registry,ref=${{ env.PRODUCTION_BUILDER_IMAGE_REF }}
          # embed cache metadata into the image being pushed so it can be used on the next run against this PR
          cache-to: type=inline

      - name: Build Runtime Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.mise_version.outputs.changed == 'true'
        with:
          context: images/debian/runtime
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.PRODUCTION_RUNTIME_IMAGE_REF }}
          push: true
          cache-from: type=registry,ref=${{ env.PRODUCTION_BUILDER_IMAGE_REF }}
          cache-to: type=inline

  # End-to-end integration tests for CLI subcommands (schema, info, plan, prepare, build)
  # and frontend builds (using buildctl and docker buildx). Tasks are defined in .mise/tasks/test/integration/.
  cli-e2e:
    name: CLI E2E
    needs: [build-images, find-examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # GitHub's preinstalled Docker 28 uses the classic image store, which disables
      # Railpack's merge operations. Fresh Docker 29+ daemons use containerd by default.
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: ${{ env.DOCKER_VERSION }}

      - name: Start local registry
        run: mise run image-run-registry

      - name: Set up test environment
        run: mise run retry --attempts 5 -- mise run setup

      - name: Test schema
        run: mise run test:integration:schema

      - name: Select Random Example
        env:
          EXAMPLES: ${{ needs.find-examples.outputs.examples }}
        run: |
          example=$(jq -r '.[]' <<< "$EXAMPLES" | shuf -n 1)
          echo "Selected $example"
          echo "EXAMPLE_PROJECT_NAME=$example" >> "$GITHUB_ENV"

      - name: Test info
        run: mise run test:integration:info

      - name: Test plan and local build
        run: mise run test:integration:plan-and-local-build

      # The task fixes node-bun so it can verify --previous and --start-cmd at runtime.
      - name: Test prepare and frontend buildctl build
        # Pass GITHUB_TOKEN to BuildKit to prevent GitHub API rate-limiting (HTTP 403) when mise downloads tool packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run test:integration:prepare-and-frontend-buildctl-build

      - name: Test prepare and frontend buildx build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run test:integration:prepare-and-frontend-buildx-build

      - name: Stop BuildKit
        if: always()
        run: |
          docker stop buildkit || true
          docker stop railpack-registry || true

  test:
    needs: [build-images, find-examples]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # create a separate job for each entry in examples/. i.e. gleam, elixir-ecto, etc
        example: ${{ fromJson(needs.find-examples.outputs.examples) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: ${{ env.DOCKER_VERSION }}

      - name: Cache Go modules and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          #   ~/.cache/go-build  -> GOCACHE (Compiled build artifacts)
          #   ~/go/pkg/mod       -> GOMODCACHE (Downloaded dependencies)
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('mise.lock') }}-

      # not strictly required, but authenticating increases rate limits and reduces 429 errors
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.PRODUCTION_CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # intermittent docker pull failures kept failing the entire pipeline, which is why we are retrying
      - name: Start BuildKit
        run: mise run retry --attempts 5 -- mise run run-buildkit-container

      # required for integration tests that use multiple platforms
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Run test for ${{ matrix.example }}
        env:
          # without the GITHUB_TOKEN, mise will 403 us
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # each test should be run with an exact match otherwise `gleam` will also match `gleam-custom` causing duplicate test runs
        run: |
          go test -v ./integration_tests \
            -run "^TestExamplesIntegration/${{ matrix.example }}$" \
            -timeout 20m

      - name: Upload size.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-x86-${{ matrix.example }}
          path: examples/${{ matrix.example }}/size.json
          if-no-files-found: ignore

      - name: Stop BuildKit
        if: always()
        run: docker stop buildkit

  # Same as `test`, but runs on native ARM hardware to catch ARM-specific failures
  # without QEMU emulation overhead.
  test-arm:
    needs: [build-images, find-examples]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        example: ${{ fromJson(needs.find-examples.outputs.examples) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: ${{ env.DOCKER_VERSION }}

      - name: Cache Go modules and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # include runner.arch so ARM and x86 caches don't collide
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.PRODUCTION_CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start BuildKit
        run: mise run run-buildkit-container

      # QEMU provides x86 emulation on this ARM runner for any cross-platform build steps
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Run test for ${{ matrix.example }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go test -v ./integration_tests \
            -run "^TestExamplesIntegration/${{ matrix.example }}$" \
            -timeout 20m

      - name: Upload size.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-arm-${{ matrix.example }}
          path: examples/${{ matrix.example }}/size.json
          if-no-files-found: ignore

      - name: Stop BuildKit
        if: always()
        run: docker stop buildkit

  # Collects size.json artifacts from both x86 and ARM matrix jobs, merges them
  # into a single benchmark payload with arch-suffixed names (e.g. "node-bun (x86)").
  # On main, pushes results to gh-pages to track history.
  # On PRs, compares against stored history and posts a comment with the delta.
  docker-image-benchmark:
    needs: [test, test-arm]
    runs-on: ubuntu-latest
    permissions:
      # required for benchmark-action to push to gh-pages on main
      contents: write
      # required to post comparison comments on PRs
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all size artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # each artifact lands in its own size-{x86,arm}-<example>/ directory
        with:
          pattern: size-*
          merge-multiple: false

      - name: Merge size.json files into benchmark format
        # customSmallerIsBetter expects [{name, unit, value}]; suffix name with arch for side-by-side comparison
        run: |
          # create a master size.json for manual debugging
          jq -s 'map(. + {name: (.name + " (x86)")})' size-x86-*/size.json > x86.json
          jq -s 'map(. + {name: (.name + " (arm)")})' size-arm-*/size.json > arm.json
          # this debugging data is compared against the "master" copy in gh-pages
          jq -s 'add | sort_by(.name) | map({name, unit: "bytes", value: .size})' x86.json arm.json > benchmark.json

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # only persist history on main
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          benchmark-data-dir-path: dev/bench
          # alert when an image grows more than 20%
          alert-threshold: "120%"
          # Enable Job Summary for PRs
          summary-always: true
          # no comment-on-alert, comment-always; just on PR
