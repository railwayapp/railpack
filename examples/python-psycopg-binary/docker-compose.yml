services:
  postgres:
    image: postgres:17-alpine
    # marks test services so leaked containers can be cleaned up (see mise clean)
    labels:
      com.railpack.integration-test: "true"
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
